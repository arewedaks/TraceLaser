[workspace]
resolver = "2"
# Patched copies of dependencies, not workspace members (vendor/README.md).
exclude = ["vendor"]
members = [
    "crates/tracelaser-core",
    "crates/tracelaser-cdr-format",
    "crates/tracelaser-cdr",
    "crates/tracelaser-io",
    "crates/tracelaser-text",
    "crates/tracelaser-render",
    "crates/tracelaser-vba",
    "crates/tracelaser-vba-project",
    "crates/tracelaser-tracecut",
    "apps/tracelaser",
    "apps/tracelaser-cli",
    "apps/tracelaser-thumbnailer",
]

[workspace.package]
version = "0.45.2"
edition = "2021"
authors = ["TraceLaser members and contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/arewedaks/TraceLaser"
homepage = "https://github.com/arewedaks/TraceLaser"
rust-version = "1.89"

[workspace.dependencies]
tracelaser-core = { path = "crates/tracelaser-core" }
tracelaser-cdr-format = { path = "crates/tracelaser-cdr-format" }
tracelaser-cdr = { path = "crates/tracelaser-cdr" }
tracelaser-io = { path = "crates/tracelaser-io" }
tracelaser-text = { path = "crates/tracelaser-text" }
tracelaser-render = { path = "crates/tracelaser-render" }
tracelaser-vba = { path = "crates/tracelaser-vba" }
tracelaser-vba-project = { path = "crates/tracelaser-vba-project" }
tracelaser-tracecut = { path = "crates/tracelaser-tracecut" }

kurbo = { version = "0.13", features = ["serde"] }
tiny-skia = "0.12"
fontdb = "0.24"
ttf-parser = { version = "0.25", features = ["gvar-alloc"] }
rustybuzz = "0.20"
unicode-general-category = "1.1"
serde = { version = "1", features = ["derive"] }
# `unbounded_depth` lets the `.tdraw` reader lift the JSON reader's
# 128-level nesting limit (see `Document::from_json`).
serde_json = { version = "1", features = ["unbounded_depth"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.36"
rfd = "0.17"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# The browser build (wasm32): size matters more than the last percent of speed.
[profile.web]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2

# eframe 0.36.2 with the OpenGL context fallback of eframe 0.37 (an
# OpenGL 2.1 driver gets a compatibility context, #616); see
# vendor/README.md. Drop it when moving to egui 0.37 or later.
[patch.crates-io]
eframe = { path = "vendor/eframe" }
# winit 0.30.13 reporting a graphics tablet's pen pressure on X11 and
# macOS as a touch with a force (#850); see vendor/README.md. Drop it
# when a winit release carries pen pressure on those platforms.
winit = { path = "vendor/winit" }
