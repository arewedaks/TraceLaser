[package]
name = "tracelaser-cdr"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Clean-room reader for .cdr files: RIFF and ZIP containers"

[dependencies]
tracelaser-core.workspace = true
tracelaser-cdr-format.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
zip.workspace = true
encoding_rs.workspace = true
flate2 = "1"
ttf-parser.workspace = true
tiny-skia.workspace = true
web-time = "1"

[dev-dependencies]
tracelaser-core = { workspace = true, features = ["test-profiles"] }
tracelaser-cdr-format = { workspace = true, features = ["test-support"] }
